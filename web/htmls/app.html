<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>OA CLI Docs</title>
    <link rel="stylesheet" href="../styles.css" />
</head>

<body>
    <div id="app-progress" class="app-progress hidden">
        <div class="progress-header">
            <span id="progress-title">Processing...</span>
            <span id="progress-percent">0%</span>
        </div>
        <div class="progress-bar">
            <div id="progress-fill" class="progress-fill"></div>
        </div>
        <div id="progress-details" class="progress-details">Starting operation...</div>
    </div>
    <div class="app has-terminal">
        <aside class="sidebar left-sidebar">
            <div class="brand"><img src="https://raw.githubusercontent.com/openage/openage.github.io/master/logo.png"
                    alt="OA CLI" />
                <div><strong>OA CLI</strong><br /><small>Interactive docs</small></div>
            </div>
            <div class="nav">
                <h3>Directory</h3>
                <div id="dir-list"></div>
            </div>
            <footer id="status-bar" class="status-bar"></footer>
        </aside>
        <main class="main">
            <header class="topbar">
                <div class="topbar-left">
                    <h1 id="page-title">Overview</h1>
                    <div id="header-breadcrumb" class="header-breadcrumb"></div>
                </div>
                <div class="topbar-right">
                    <span class="workspace-pill">
                        <span class="workspace-dot" aria-hidden="true"></span>
                        <span id="workspace-label">Workspace</span>
                    </span>
                    <button id="user-avatar" type="button" class="avatar-btn" title="Current user">OA</button>
                </div>
            </header>
            <section id="main-content"></section>
        </main>
        <aside class="sidebar terminal-sidebar">
            <div id="terminal-host"></div>
        </aside>
        <button id="terminal-toggle-tab" class="terminal-toggle-tab" type="button" title="Toggle terminal"></button>
    </div>
    <script type="module" src="../app.js"></script>
</body>

</html>
