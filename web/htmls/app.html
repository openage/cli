<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>OA CLI Docs</title>
    <link rel="stylesheet" href="../styles.css" />
</head>

<body>
    <div id="app-progress" class="app-progress hidden">
        <div class="progress-header">
            <span id="progress-title">Processing...</span>
            <span id="progress-percent">0%</span>
        </div>
        <div class="progress-bar">
            <div id="progress-fill" class="progress-fill"></div>
        </div>
        <div id="progress-details" class="progress-details">Starting operation...</div>
    </div>
    <div class="app has-terminal">
        <aside class="sidebar left-sidebar">
            <div class="activity-rail">
                <a id="brand-link" class="activity-brand" href="#" title="OA CLI" aria-label="OA CLI">
                    <img src="https://raw.githubusercontent.com/openage/openage.github.io/master/logo.png" alt="" />
                    <span class="activity-brand-mark" aria-hidden="true">OA</span>
                </a>
                <nav id="activity-bar" class="activity-bar" aria-label="Primary navigation">
                    <button type="button" class="activity-root is-active" data-root="home" title="Home"
                        aria-label="Home">
                        <svg viewBox="0 0 24 24" aria-hidden="true">
                            <path d="m3 10 9-7 9 7v10a1 1 0 0 1-1 1h-5v-7H9v7H4a1 1 0 0 1-1-1z" />
                        </svg>
                    </button>
                    <button type="button" class="activity-root" data-root="data" title="Data Explorer"
                        aria-label="Data Explorer">
                        <svg viewBox="0 0 24 24" aria-hidden="true">
                            <path d="M12 3c-5 0-9 1.3-9 3s4 3 9 3 9-1.3 9-3-4-3-9-3Z" />
                            <path d="M3 6v12c0 1.7 4 3 9 3s9-1.3 9-3V6M3 12c0 1.7 4 3 9 3s9-1.3 9-3" />
                        </svg>
                    </button>
                    <button type="button" class="activity-root" data-root="specs" title="Specs Explorer"
                        aria-label="Specs Explorer">
                        <svg viewBox="0 0 24 24" aria-hidden="true">
                            <path d="M6 2h8l5 5v15H6a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2Z" />
                            <path d="M14 2v6h6M8 13h8M8 17h8" />
                        </svg>
                    </button>
                </nav>
                <div class="activity-utilities" aria-label="Workspace and appearance">
                    <button id="terminal-toggle-tab" class="topbar-icon-btn terminal-toggle-tab" type="button"
                        title="Hide Terminal" aria-label="Hide Terminal">
                        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor"
                            stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                            <rect x="3" y="3" width="18" height="18" rx="2" />
                            <path d="M15 3v18M7 9l3 3-3 3" />
                        </svg>
                    </button>
                    <button id="user-avatar" type="button" class="avatar-btn is-logged-out" title="Sign in"
                        aria-label="Sign in" aria-haspopup="dialog" aria-expanded="false">
                        <svg viewBox="0 0 24 24" aria-hidden="true">
                            <path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4" />
                            <path d="m10 17 5-5-5-5M15 12H3" />
                        </svg>
                    </button>
                    <section id="user-popup" class="user-popup hidden" role="dialog" aria-label="User and session">
                        <header class="user-popup-heading">
                            <div class="user-popup-identity">
                                <strong id="user-popup-name">Not signed in</strong>
                                <span id="user-popup-role"></span>
                            </div>
                            <span id="user-popup-session-state" class="user-session-state">Signed out</span>
                        </header>
                        <div id="user-popup-details" class="user-popup-details" hidden>
                            <div><span>Workspace</span><strong id="workspace-label">Workspace</strong></div>
                            <div><span>Application</span><strong id="user-popup-application">N/A</strong></div>
                            <div><span>Organization</span><strong id="user-popup-organization">N/A</strong></div>
                            <div><span>Session</span><strong id="user-popup-session">Unknown</strong></div>
                        </div>
                        <div class="user-popup-actions">
                            <button id="user-login-action" class="user-action-primary" type="button"
                                data-user-action="login">Sign in</button>
                            <div id="user-session-actions" class="user-session-actions" hidden>
                                <button class="user-action-primary" type="button" data-user-action="renew">Renew
                                    session</button>
                                <button class="logout-btn" type="button" data-user-action="logout">Sign out</button>
                            </div>
                        </div>
                        <p id="user-popup-feedback" class="user-popup-feedback" aria-live="polite"></p>
                    </section>
                </div>
                <div class="activity-bottom">
                    <button type="button" class="activity-root" id="preferences-root" data-root="preferences"
                        title="Preferences" aria-label="Preferences">
                        <svg viewBox="0 0 24 24" aria-hidden="true">
                            <path d="M12 8a4 4 0 1 0 0 8 4 4 0 0 0 0-8Z" />
                            <path
                                d="m19.4 15 .1.1a2 2 0 1 1-2.8 2.8l-.1-.1a2 2 0 0 0-3.4 1.4v.2a2 2 0 1 1-4 0v-.2a2 2 0 0 0-3.4-1.4l-.1.1a2 2 0 1 1-2.8-2.8l-.1-.1A2 2 0 0 0 1.6 12H1.5a2 2 0 1 1 0-4h.2a2 2 0 0 0 1.4-3.4L3 4.5a2 2 0 1 1 2.8-2.8l.1.1A2 2 0 0 0 9.3.4V.3a2 2 0 1 1 4 0v.2a2 2 0 0 0 3.4 1.4l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a2 2 0 0 0 1.4 3.4h.2a2 2 0 1 1 0 4h-.2a2 2 0 0 0-1.5 2.9Z" />
                        </svg>
                    </button>
                </div>
                <footer id="status-bar" class="status-bar activity-status-bar"></footer>
            </div>
            <div id="explorer-pane" class="explorer-pane">
                <div class="explorer-heading">
                    <div class="explorer-heading-copy">
                        <h2 id="explorer-title">Home</h2>
                        <h1 id="page-title">Overview</h1>
                        <div id="header-breadcrumb" class="header-breadcrumb"></div>
                    </div>
                    <button type="button" id="explorer-collapse" class="icon-button" title="Hide Explorer"
                        aria-label="Hide Explorer">‹</button>
                </div>
                <section id="preferences-appearance" class="preferences-appearance" hidden>
                    <h4>Appearance</h4>
                    <button id="theme-mode-btn" type="button" class="nav-link appearance-action"
                        title="Switch to Light Mode">
                        <svg class="nav-icon" viewBox="0 0 24 24" width="16" height="16" fill="none"
                            stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
                            aria-hidden="true">
                            <circle cx="12" cy="12" r="5" />
                            <path
                                d="M12 1v2m0 18v2M4.22 4.22l1.42 1.42m12.72 12.72 1.42 1.42M1 12h2m18 0h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42" />
                        </svg>
                        <span id="theme-mode-label">Switch to Light Mode</span>
                    </button>
                    <button id="theme-picker-btn" type="button" class="nav-link appearance-action"
                        title="Themes & Color Options">
                        <svg class="nav-icon" viewBox="0 0 24 24" width="16" height="16" fill="none"
                            stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
                            aria-hidden="true">
                            <circle cx="13.5" cy="6.5" r=".5" fill="currentColor" />
                            <circle cx="17.5" cy="10.5" r=".5" fill="currentColor" />
                            <circle cx="8.5" cy="7.5" r=".5" fill="currentColor" />
                            <circle cx="6.5" cy="12.5" r=".5" fill="currentColor" />
                            <path
                                d="M12 2C6.5 2 2 6.5 2 12s4.5 10 10 10c.926 0 1.648-.746 1.648-1.688 0-.437-.18-.835-.437-1.125-.29-.289-.438-.652-.438-1.125a1.64 1.64 0 0 1 1.668-1.668h1.996c3.051 0 5.555-2.503 5.555-5.554C21.965 6.012 17.461 2 12 2z" />
                        </svg>
                        <span>Themes & Color Options</span>
                    </button>
                </section>
                <div class="nav">
                    <div id="dir-list"></div>
                </div>
            </div>
        </aside>
        <main class="main">
            <section id="main-content"></section>
        </main>
        <aside class="sidebar terminal-sidebar">
            <div id="terminal-host"></div>
        </aside>
    </div>

    <!-- Theme Settings Panel -->
    <div id="theme-panel" class="theme-panel hidden" role="dialog" aria-label="Theme Customization">
        <div class="theme-panel-header">
            <div class="theme-panel-title">
                <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2">
                    <circle cx="13.5" cy="6.5" r=".5" fill="currentColor" />
                    <circle cx="17.5" cy="10.5" r=".5" fill="currentColor" />
                    <circle cx="8.5" cy="7.5" r=".5" fill="currentColor" />
                    <circle cx="6.5" cy="12.5" r=".5" fill="currentColor" />
                    <path
                        d="M12 2C6.5 2 2 6.5 2 12s4.5 10 10 10c.926 0 1.648-.746 1.648-1.688 0-.437-.18-.835-.437-1.125-.29-.289-.438-.652-.438-1.125a1.64 1.64 0 0 1 1.668-1.668h1.996c3.051 0 5.555-2.503 5.555-5.554C21.965 6.012 17.461 2 12 2z" />
                </svg>
                <span>Theme & Appearance</span>
            </div>
            <button id="theme-panel-close" type="button" class="theme-panel-close-btn"
                aria-label="Close theme panel">&times;</button>
        </div>

        <div class="theme-panel-body">
            <!-- Mode Selection -->
            <div class="theme-panel-group">
                <span class="theme-group-label">Color Mode</span>
                <div class="theme-mode-tabs" role="tablist">
                    <button type="button" class="theme-mode-tab" data-mode="light" role="tab">
                        <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor"
                            stroke-width="2">
                            <circle cx="12" cy="12" r="4" />
                            <path
                                d="M12 2v2m0 16v2M4.93 4.93l1.41 1.41m11.32 11.32l1.41 1.41M2 12h2m16 0h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41" />
                        </svg>
                        <span>Light</span>
                    </button>
                    <button type="button" class="theme-mode-tab active" data-mode="dark" role="tab">
                        <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor"
                            stroke-width="2">
                            <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z" />
                        </svg>
                        <span>Dark</span>
                    </button>
                    <button type="button" class="theme-mode-tab" data-mode="system" role="tab">
                        <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor"
                            stroke-width="2">
                            <rect x="2" y="3" width="20" height="14" rx="2" />
                            <line x1="8" y1="21" x2="16" y2="21" />
                            <line x1="12" y1="17" x2="12" y2="21" />
                        </svg>
                        <span>Auto</span>
                    </button>
                </div>
            </div>

            <!-- Theme Presets -->
            <div class="theme-panel-group">
                <span class="theme-group-label">Theme Preset</span>
                <div class="theme-presets-list">
                    <!-- MS Fabric -->
                    <button type="button" class="theme-preset-card" data-theme="ms-fabric">
                        <div class="theme-preset-header">
                            <span class="theme-preset-name">MS Fabric</span>
                            <span class="theme-preset-badge">Fluent</span>
                        </div>
                        <div class="theme-preset-preview">
                            <span class="preview-chip" style="background: #0078d4;"></span>
                            <span class="preview-chip" style="background: #201f1e;"></span>
                            <span class="preview-chip" style="background: #f3f2f1;"></span>
                        </div>
                        <p class="theme-preset-desc">Microsoft Fluent & Fabric design</p>
                    </button>

                    <!-- GitHub -->
                    <button type="button" class="theme-preset-card" data-theme="github">
                        <div class="theme-preset-header">
                            <span class="theme-preset-name">GitHub</span>
                            <span class="theme-preset-badge">Primer</span>
                        </div>
                        <div class="theme-preset-preview">
                            <span class="preview-chip" style="background: #0969da;"></span>
                            <span class="preview-chip" style="background: #0d1117;"></span>
                            <span class="preview-chip" style="background: #ffffff;"></span>
                        </div>
                        <p class="theme-preset-desc">Clean engineering & GitHub Primer</p>
                    </button>

                    <!-- Monokai -->
                    <button type="button" class="theme-preset-card" data-theme="monokai">
                        <div class="theme-preset-header">
                            <span class="theme-preset-name">Monokai</span>
                            <span class="theme-preset-badge">Pro</span>
                        </div>
                        <div class="theme-preset-preview">
                            <span class="preview-chip" style="background: #a6e22e;"></span>
                            <span class="preview-chip" style="background: #f92672;"></span>
                            <span class="preview-chip" style="background: #272822;"></span>
                        </div>
                        <p class="theme-preset-desc">Classic vibrant code contrast</p>
                    </button>

                    <!-- One Dark Pro -->
                    <button type="button" class="theme-preset-card" data-theme="one-dark-pro">
                        <div class="theme-preset-header">
                            <span class="theme-preset-name">One Dark Pro</span>
                            <span class="theme-preset-badge">Atom</span>
                        </div>
                        <div class="theme-preset-preview">
                            <span class="preview-chip" style="background: #61afef;"></span>
                            <span class="preview-chip" style="background: #e06c75;"></span>
                            <span class="preview-chip" style="background: #282c34;"></span>
                        </div>
                        <p class="theme-preset-desc">Balanced developer theme</p>
                    </button>
                </div>
            </div>

            <!-- Color Options -->
            <div class="theme-panel-group">
                <span class="theme-group-label">Accent Color Options</span>
                <div id="theme-colors-palette" class="theme-colors-palette"></div>
            </div>
        </div>
    </div>
    <script type="module" src="../app.js"></script>
</body>

</html>
